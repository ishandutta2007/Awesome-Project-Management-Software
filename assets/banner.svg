<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>

    <linearGradient id="card-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f242d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0e131b" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 46px; fill: url(#text-grad); }
    .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 20px; fill: #8b949e; }
    .badge-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #c9d1d9; }
    
    /* Subtle background animations in lower layer */
    @keyframes float1 { 0% { transform: translate(0, 0); } 50% { transform: translate(0, -12px); } 100% { transform: translate(0, 0); } }
    @keyframes float2 { 0% { transform: translate(0, 0); } 50% { transform: translate(0, 10px); } 100% { transform: translate(0, 0); } }
    @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 0.7; } 100% { opacity: 0.3; } }
    @keyframes progress { 0% { width: 40px; } 50% { width: 140px; } 100% { width: 40px; } }

    .anim-float1 { animation: float1 6s ease-in-out infinite; }
    .anim-float2 { animation: float2 7s ease-in-out infinite; }
    .anim-pulse { animation: pulse 4s ease-in-out infinite; }
    .anim-progress { animation: progress 5s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="2"/>

  <!-- Background Animated Decorative Elements (Behind Text) -->
  <g class="anim-pulse" opacity="0.4">
    <circle cx="150" cy="80" r="120" fill="#58a6ff" filter="blur(60px)"/>
    <circle cx="1050" cy="280" r="140" fill="#bc8cff" filter="blur(70px)"/>
    <circle cx="900" cy="60" r="90" fill="#3fb950" filter="blur(50px)"/>
  </g>

  <!-- Background Dynamic Grid & Flow Graphics -->
  <g opacity="0.15" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4">
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1100" y1="0" x2="1100" y2="360"/>
  </g>

  <!-- Floating Kanban/Sprint Dynamic Cards (Right Side Background Element) -->
  <g class="anim-float1" transform="translate(820, 60)">
    <rect width="280" height="70" rx="10" fill="url(#card-grad1)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="15" y="18" width="80" height="10" rx="5" fill="#58a6ff"/>
    <rect x="15" y="38" width="180" height="8" rx="4" fill="#8b949e" opacity="0.6"/>
    <rect x="15" y="52" width="40" height="6" rx="3" fill="#3fb950"/>
    <circle cx="245" cy="35" r="14" fill="#1f6feb"/>
    <text x="245" y="39" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fff" font-weight="bold">PM</text>
  </g>

  <g class="anim-float2" transform="translate(860, 150)">
    <rect width="260" height="75" rx="10" fill="url(#card-grad1)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="15" y="18" width="100" height="10" rx="5" fill="#bc8cff"/>
    <rect x="15" y="38" width="140" height="8" rx="4" fill="#8b949e" opacity="0.6"/>
    <!-- Dynamic animated progress bar -->
    <rect x="15" y="54" width="200" height="6" rx="3" fill="#21262d"/>
    <rect class="anim-progress" x="15" y="54" width="120" height="6" rx="3" fill="#bc8cff"/>
  </g>

  <g class="anim-float1" transform="translate(800, 245)">
    <rect width="270" height="65" rx="10" fill="url(#card-grad1)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="15" y="16" width="70" height="10" rx="5" fill="#3fb950"/>
    <rect x="15" y="36" width="160" height="8" rx="4" fill="#8b949e" opacity="0.6"/>
    <circle cx="230" cy="32" r="12" fill="#238636"/>
    <text x="230" y="36" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fff">✓</text>
  </g>

  <!-- Foreground Main Title & Subtitle (Guaranteed Clear & Visible) -->
  <g transform="translate(70, 130)">
    <!-- Pill Badge above Title -->
    <g transform="translate(0, -55)">
      <rect width="250" height="28" rx="14" fill="#21262d" stroke="#30363d"/>
      <circle cx="15" cy="14" r="5" fill="#3fb950"/>
      <text x="30" y="18" class="badge-text">🚀 Curated SaaS &amp; Open-Source Ecosystem</text>
    </g>

    <text x="0" y="20" class="title">Awesome Project Management</text>
    <text x="0" y="60" class="subtitle">Empowering teams with top Agile, Kanban, &amp; Portfolio tools.</text>

    <!-- Stat/Category Pills below Subtitle -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="120" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="60" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#58a6ff" font-weight="600">📊 SaaS Leaders</text>

      <rect x="135" y="0" width="145" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="207" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#bc8cff" font-weight="600">⚡ Open-Source Stars</text>

      <rect x="295" y="0" width="130" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="360" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3fb950" font-weight="600">🤖 AI-Native PM</text>
    </g>
  </g>

</svg>
